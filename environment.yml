# conda env create -f environment.yml && conda activate fuelmap
# Installs the CPU/CUDA PyTorch wheel that pip selects for your platform; for a
# specific CUDA build see https://pytorch.org/get-started/locally/
# Paper-era versions: python 3.10.13, torch 2.1.1, numpy 1.26.0, rasterio 1.3.9, gdal 3.6.2.
# Tested with numpy 1.24-1.26; numpy 2.x has not been tested (use "numpy>=1.24,<2" if it causes problems).
name: fuelmap
channels:
  - conda-forge
dependencies:
  - python>=3.9,<3.13
  - numpy>=1.24
  - gdal>=3.6
  - rasterio>=1.3
  - pyyaml>=6.0
  - tqdm>=4.60
  - pytest
  - matplotlib-base>=3.6   # scripts/make_demo_figures.py (README demo figures)
  - pip
  - pip:
      - torch>=2.0
      # - wandb>=0.16   # optional experiment logging (scripts/train.py --wandb)
